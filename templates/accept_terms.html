<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Accept Terms | BESTTIVE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f6f1fb;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .terms-card {

            width: 500px;
            max-width: 100%;

            background: white;

            padding: 40px 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(75, 0, 130, 0.15);

            text-align: center;
        }


        .terms-icon {

            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #4b0082;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }


        h1 {

            margin: 0 0 10px;

            color: #4b0082;

            font-size: 27px;
        }


        .subtitle {

            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


        .agreement {

            text-align: left;

            background: #f8f4fc;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 20px;

            display: flex;

            align-items: flex-start;

            gap: 10px;

            line-height: 1.6;
        }


        .agreement input {

            margin-top: 5px;

            width: 18px;
            height: 18px;

            cursor: pointer;

            accent-color: #4b0082;

            flex-shrink: 0;
        }


        .agreement label {

            font-size: 14px;

            color: #444;

            cursor: pointer;
        }


        .agreement a {

            color: #4b0082;

            font-weight: bold;

            text-decoration: none;
        }


        .continue-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4b0082;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        .continue-btn:disabled {

            background: #b9a6c8;

            cursor: not-allowed;
        }


        .security-text {

            margin-top: 20px;

            font-size: 13px;

            color: #777;
        }


        @media (max-width: 500px) {

            .terms-card {

                padding: 30px 20px;
            }


            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="terms-card">


        <div class="terms-icon">
            ✓
        </div>


        <h1>
            Almost There!
        </h1>


        <div class="subtitle">

            Before creating your BESTTIVE account, please review and
            accept our Terms & Conditions and Privacy Policy.

        </div>


        <form method="POST">


            <div class="agreement">


                <input
                    type="checkbox"
                    id="acceptTerms"
                    name="accept_terms"
                    required
                >


                <label for="acceptTerms">

                    I agree to the

                    <a
                        href="/terms-conditions"
                        target="_blank"
                    >
                        Terms & Conditions
                    </a>

                    and acknowledge the

                    <a
                        href="/privacy-policy"
                        target="_blank"
                    >
                        Privacy Policy
                    </a>.

                </label>


            </div>


            <button
                type="submit"
                class="continue-btn"
                id="continueBtn"
                disabled
            >
                Create Account & Continue
            </button>


        </form>


        <div class="security-text">

            🔒 Your account information is protected.

        </div>


    </div>


    <script>

        const checkbox =
            document.getElementById("acceptTerms");

        const continueBtn =
            document.getElementById("continueBtn");


        checkbox.addEventListener(
            "change",
            function() {

                continueBtn.disabled =
                    !checkbox.checked;

            }
        );

    </script>


</body>

</html>
