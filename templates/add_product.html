<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>

<h2>Add New Product</h2>

<form method="POST" enctype="multipart/form-data">

    <p>Product Name</p>
    <input type="text" name="name" required>

    <p>Price</p>
    <input type="number" name="price" required>

    <p>Description</p>
    <textarea name="description"></textarea>
<p>Category</p>

<select name="category" required onchange="updateSubcategories()">
    <option value="">Select Category</option>
    <option value="Clothes">Clothes</option>
    <option value="Toys">Toys</option>
    <option value="Jewellery">Jewellery</option>
    <option value="Beauty">Beauty</option>
    <option value="Shoes">Shoes</option>
    <option value="Watches">Watches</option>
    <option value="Electronics">Electronics</option>
    <option value="Home">Home</option>
</select>

<p>Subcategory</p>

<select name="subcategory" required>
    <option value="">Select Subcategory</option>
    <option value="Jeans">Jeans</option>
    <option value="Shirts">Shirts</option>
    <option value="T-Shirts">T-Shirts</option>
    <option value="Dresses">Dresses</option>
    <option value="Bangles">Bangles</option>
    <option value="Earrings">Earrings</option>
    <option value="Necklace">Necklace</option>
    <option value="Cars">Cars</option>
    <option value="Dolls">Dolls</option>
</select>

    <p>Stock</p>
    <input type="number" name="stock">

    <p>Main Product Image</p>
<input type="file" name="image" accept="image/*" required>

<br><br>

<p>Extra Image 1</p>
<input type="file" name="image2" accept="image/*">

<br><br>

<p>Extra Image 2</p>
<input type="file" name="image3" accept="image/*">

<br><br>

<p>Extra Image 3</p>
<input type="file" name="image4" accept="image/*">

<br><br>

<p>Extra Image 4</p>
<input type="file" name="image5" accept="image/*">
    <br><br>

    <button type="submit">Save Product</button>

</form>
<script>
function updateSubcategories() {

    const category = document.querySelector('select[name="category"]').value;
    const subcategory = document.querySelector('select[name="subcategory"]');

    const options = {
        "Clothes": [
            "Jeans",
            "Shirts",
            "T-Shirts",
            "Dresses",
            "Sarees"
        ],

        "Toys": [
            "Cars",
            "Dolls",
            "Educational Toys",
            "Remote Control"
        ],

        "Jewellery": [
            "Bangles",
            "Earrings",
            "Necklace",
            "Rings"
        ],

        "Beauty": [
            "Makeup",
            "Skincare",
            "Hair Care"
        ],

        "Shoes": [
            "Men Shoes",
            "Women Shoes",
            "Kids Shoes",
            "Sports Shoes"
        ],

        "Watches": [
            "Men Watches",
            "Women Watches",
            "Kids Watches"
        ],

        "Electronics": [
            "Mobile",
            "Earbuds",
            "Speakers",
            "Accessories"
        ],

        "Home": [
            "Decor",
            "Kitchen",
            "Storage"
        ]
    };

    subcategory.innerHTML =
        '<option value="">Select Subcategory</option>';

    if (options[category]) {

        options[category].forEach(function(item) {

            const option = document.createElement("option");

            option.value = item;
            option.textContent = item;

            subcategory.appendChild(option);

        });
    }
}
</script>

</body>
</html>
