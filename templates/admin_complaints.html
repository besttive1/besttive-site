<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Complaints - BESTTIVE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .contact-admin {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .contact-admin h1 {
            color: #4b0082;
            margin-bottom: 20px;
        }


        /* DELETE BUTTON */

        .complaint-toolbar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
        }

        .delete-mode-btn {
            border: none;
            border-radius: 7px;

            padding: 9px 16px;

            background: #4b0082 !important;
            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: auto !important;
        }

        .delete-mode-btn:hover {
            background: #310058 !important;
        }


        /* COMPLAINT CARD */

        .message-card {
            position: relative;

            background: white;

            border: 1px solid #eee;
            border-radius: 12px;

            padding: 20px;
            margin-bottom: 15px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .message-card h3 {
            margin: 0 0 8px;
            color: #333;
        }

        .message-card p {
            margin: 6px 0;
            color: #555;
        }

        .message-text {
            margin-top: 15px !important;
            padding: 12px;

            background: #faf7ff;

            border-radius: 8px;
        }


        /* CHECKBOX */

        .complaint-checkbox {
            display: none;

            width: 18px;
            height: 18px;

            margin-bottom: 12px;

            cursor: pointer;
        }


        /* EMPTY */

        .no-messages {
            padding: 30px;

            text-align: center;

            color: #777;

            background: white;

            border-radius: 10px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .contact-admin {
                width: 92%;
                margin: 20px auto;
            }

            .complaint-toolbar {
                justify-content: flex-end;
            }

            .delete-mode-btn {
                font-size: 13px;
                padding: 9px 13px;
            }

            .message-card {
                padding: 15px;
            }

        }

    </style>
</head>


<body>

    <div class="contact-admin">

        <h1>Customer Complaints</h1>


        <!-- SINGLE DELETE BUTTON -->

        <div class="complaint-toolbar">

    <form action="/admin/delete-complaints"
          method="POST"
          id="deleteForm">

        <button type="button"
                class="delete-mode-btn"
                id="deleteBtn"
                onclick="handleDeleteClick()">
            🗑️ Delete
        </button>

    </form>

</div>


        <!-- COMPLAINTS -->

        {% if messages %}

            {% for msg in messages %}

                <div class="message-card">

                    <input type="checkbox"
                           class="complaint-checkbox"
                           name="complaint_ids"
                           value="{{ msg.id }}"
                           form="deleteForm">


                    <h3>
                        {{ msg.name }}
                    </h3>


                    <p>
                        <strong>Email:</strong>
                        {{ msg.email }}
                    </p>


                    <p>
                        <strong>Phone:</strong>
                        {{ msg.phone or "Not provided" }}
                    </p>


                    <p class="message-text">

                        <strong>Message:</strong><br>

                        {{ msg.message }}

                    </p>

                </div>

            {% endfor %}


        {% else %}

            <div class="no-messages">
                No customer complaints yet.
            </div>

        {% endif %}

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function handleDeleteClick(event) {

            const checkboxes =
                document.querySelectorAll(".complaint-checkbox");

            const selected =
                document.querySelectorAll(
                    ".complaint-checkbox:checked"
                );


            /* FIRST CLICK
               SHOW CHECKBOXES */

            if (selected.length === 0) {

                event.preventDefault();

                checkboxes.forEach(function (checkbox) {

                    checkbox.style.display = "block";

                });

                return false;
            }


            /* SECOND CLICK
               DELETE SELECTED */

            return confirm(
                "Are you sure you want to delete the selected complaint(s)?"
            );
        }

    </script>
<script>
function handleDeleteClick() {

    const checkboxes = document.querySelectorAll(".complaint-checkbox");

    const selected = document.querySelectorAll(
        ".complaint-checkbox:checked"
    );

    // First click: show checkboxes
    if (selected.length === 0) {

        checkboxes.forEach(function (checkbox) {
            checkbox.style.display = "block";
        });

        return;
    }

    // Second click: confirm and delete
    const confirmDelete = confirm(
        "Are you sure you want to delete the selected complaint(s)?"
    );

    if (confirmDelete) {
        document.getElementById("deleteForm").submit();
    }
}
</script>

</body>
</html>
