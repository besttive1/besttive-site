<!DOCTYPE html>
<html>
<head>
    <title>Customers | BESTTIVE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">

<h2>👥 Customers</h2>

<br>

<!-- REMOVE BUTTON -->
<button type="button"
        id="removeModeBtn"
        class="btn btn-danger mb-3"
        onclick="enableRemoveMode()">

    🗑️ Remove Customers

</button>

<form method="POST"
      action="/admin/delete-customers"
      id="customerForm"
      onsubmit="return confirmDelete();">

    <table class="table table-bordered table-striped">

        <thead>
        <tr>
            <th class="checkboxColumn" style="display:none;">
                Select
            </th>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>DOB</th>
        </tr>
        </thead>

        <tbody>

        {% for customer in customers %}

        <tr>

            <td class="checkboxColumn" style="display:none;">

                <input type="checkbox"
                       name="customer_ids"
                       value="{{ customer.id }}"
                       class="customerCheckbox">

            </td>

            <td>{{ customer.id }}</td>

            <td>{{ customer.name }}</td>

            <td>{{ customer.email }}</td>

            <td>{{ customer.phone }}</td>

            <td>{{ customer.address }}</td>

            <td>{{ customer.dob }}</td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <!-- DELETE SELECTED BUTTON -->

    <button type="submit"
            id="deleteSelectedBtn"
            class="btn btn-danger"
            style="display:none;">

        🗑️ Delete Selected

    </button>

    <button type="button"
            id="cancelBtn"
            class="btn btn-secondary"
            style="display:none;"
            onclick="disableRemoveMode()">

        Cancel

    </button>

</form>


<script>

function enableRemoveMode() {

    document.querySelectorAll(".checkboxColumn").forEach(function(column) {

        column.style.display = "";

    });

    document.getElementById("removeModeBtn").style.display = "none";

    document.getElementById("deleteSelectedBtn").style.display = "inline-block";

    document.getElementById("cancelBtn").style.display = "inline-block";

}


function disableRemoveMode() {

    document.querySelectorAll(".checkboxColumn").forEach(function(column) {

        column.style.display = "none";

    });

    document.querySelectorAll(".customerCheckbox").forEach(function(box) {

        box.checked = false;

    });

    document.getElementById("removeModeBtn").style.display = "inline-block";

    document.getElementById("deleteSelectedBtn").style.display = "none";

    document.getElementById("cancelBtn").style.display = "none";

}


function confirmDelete() {

    let selected = document.querySelectorAll(
        ".customerCheckbox:checked"
    );

    if (selected.length === 0) {

        alert("Please select at least one customer.");

        return false;

    }

    return confirm(
        "Are you sure you want to remove " +
        selected.length +
        " customer(s)?"
    );

}


/* ENTER / DELETE KEY SUPPORT */

document.addEventListener("keydown", function(event) {

    let removeMode =
        document.getElementById("deleteSelectedBtn").style.display !== "none";

    if (!removeMode) {
        return;
    }

    if (event.key === "Enter" || event.key === "Delete") {

        event.preventDefault();

        document.getElementById("customerForm").requestSubmit();

    }

});

</script>

</body>
</html>
