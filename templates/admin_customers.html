<!DOCTYPE html>
<html>
<head>

    <title>Customers | BESTTIVE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* PAGE */

        .customers-page {
            margin-top: 40px;
        }

        .customers-page h2 {
            margin-bottom: 25px;
        }


        /* ACTION BUTTON */

        .customer-actions {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .remove-customers-btn {
            background: #4b0082 !important;
            color: white !important;

            border: none;
            border-radius: 7px;

            padding: 9px 16px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .remove-customers-btn:hover {
            background: #310058 !important;
        }


        /* CHECKBOX */

        .checkboxColumn {
            display: none;
        }


        /* TABLE */

        .customers-table {
            margin-top: 0;
        }

    </style>

</head>


<body class="container">


<div class="customers-page">

    <h2>👥 Customers</h2>


    <!-- REMOVE BUTTON -->

    <div class="customer-actions">

        <form method="POST"
              action="/admin/delete-customers"
              id="customerForm">

            <button type="button"
                    id="removeModeBtn"
                    class="remove-customers-btn"
                    onclick="handleRemoveClick()">

                🗑️ Remove Customers

            </button>

        </form>

    </div>


    <!-- CUSTOMERS TABLE -->

    <table class="table table-bordered table-striped customers-table">

        <thead>

        <tr>

            <th class="checkboxColumn">
                Select
            </th>

            <th>Serial No.</th>

            <th>Name</th>

            <th>Email</th>

            <th>Mobile</th>

            <th>Address</th>

            <th>DOB</th>

        </tr>

        </thead>


        <tbody>

        {% for customer in customers %}

        <tr>

            <!-- CHECKBOX -->

            <td class="checkboxColumn">

                <input type="checkbox"
                       name="customer_ids"
                       value="{{ customer.id }}"
                       class="customerCheckbox"
                       form="customerForm">

            </td>


            <!-- SERIAL NUMBER -->

            <td>
                {{ loop.index }}
            </td>


            <!-- CUSTOMER NAME -->

            <td>
                {{ customer.name }}
            </td>


            <!-- EMAIL -->

            <td>
                {{ customer.email }}
            </td>


            <!-- MOBILE -->

            <td>
                {{ customer.phone }}
            </td>


            <!-- ADDRESS -->

            <td>
                {{ customer.address }}
            </td>


            <!-- DOB -->

            <td>
                {{ customer.dob }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>


<!-- JAVASCRIPT -->

<script>

function handleRemoveClick() {

    const checkboxes =
        document.querySelectorAll(".customerCheckbox");

    const selected =
        document.querySelectorAll(
            ".customerCheckbox:checked"
        );


    /* FIRST CLICK
       SHOW CHECKBOXES */

    if (selected.length === 0) {

        checkboxes.forEach(function (checkbox) {

            checkbox.closest(".checkboxColumn").style.display = "table-cell";

        });

        document.querySelectorAll(".checkboxColumn").forEach(function (column) {

            column.style.display = "table-cell";

        });

        return;
    }


    /* SECOND CLICK
       CONFIRM REMOVE */

    const confirmed = confirm(
        "Are you sure you want to remove " +
        selected.length +
        " customer(s)?"
    );


    if (confirmed) {

        document
            .getElementById("customerForm")
            .submit();

    }

}

</script>


</body>
</html>
