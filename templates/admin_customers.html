<!DOCTYPE html>
<html>
<head>

    <title>Customers | BESTTIVE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

    /* ================================
       PAGE
       ================================ */

    .customers-page {
        margin-top: 40px;
    }

    .customers-page h2 {
        margin-bottom: 25px;
    }


    /* ================================
       ACTION BUTTON
       ================================ */

    .customer-actions {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 20px;
    }

    .remove-customers-btn {
        background: #4b0082 !important;
        color: white !important;

        border: none;
        border-radius: 7px;

        padding: 9px 16px;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
    }

    .remove-customers-btn:hover {
        background: #310058 !important;
    }


    /* ================================
       CHECKBOX
       ================================ */

    .checkboxColumn {
        display: none;
    }


    /* ================================
       TABLE
       ================================ */

    .customers-table {
        margin-top: 0;
        width: 100%;
    }


    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 768px) {

        body.container {
            width: 100% !important;
            max-width: 100% !important;

            padding-left: 10px !important;
            padding-right: 10px !important;
        }

        .customers-page {
            width: 100%;
            margin-top: 20px;
        }

        .customers-page h2 {
            font-size: 22px;
            margin-bottom: 18px;
        }

        .customer-actions {
            margin-bottom: 15px;
        }

        .remove-customers-btn {
            padding: 9px 13px;
            font-size: 13px;
        }


        /* TABLE SCROLL AREA */

        .customers-table {
            width: 100% !important;
            min-width: 650px !important;

            margin-bottom: 0;
        }

        .customers-table th,
        .customers-table td {
            font-size: 12px !important;
            padding: 9px 8px !important;

            vertical-align: middle !important;
        }


        /* SERIAL NUMBER */

        .customers-table th:nth-child(2),
        .customers-table td:nth-child(2) {
            min-width: 55px;
            width: 55px;
            text-align: center;
        }


        /* NAME */

        .customers-table th:nth-child(3),
        .customers-table td:nth-child(3) {
            min-width: 85px;
        }


        /* EMAIL */

        .customers-table th:nth-child(4),
        .customers-table td:nth-child(4) {
            min-width: 160px;
        }


        /* MOBILE */

        .customers-table th:nth-child(5),
        .customers-table td:nth-child(5) {
            min-width: 110px;
        }


        /* ADDRESS */

        .customers-table th:nth-child(6),
        .customers-table td:nth-child(6) {
            min-width: 190px;
            max-width: 220px;

            white-space: normal;
            word-break: break-word;
        }


        /* DOB */

        .customers-table th:nth-child(7),
        .customers-table td:nth-child(7) {
            min-width: 90px;
        }

    }


    /* ================================
       SMALL MOBILE
       ================================ */

    @media (max-width: 480px) {

        .customers-page h2 {
            font-size: 21px;
        }

        .customers-table {
            min-width: 650px !important;
        }

        .customers-table th,
        .customers-table td {
            font-size: 12px !important;
            padding: 8px !important;
        }

    }

</style>

</head>


<body class="container">


<div class="customers-page">

    <h2>👥 Customers</h2>


    <!-- REMOVE BUTTON -->

    <div class="customer-actions">

        <form method="POST"
              action="/admin/delete-customers"
              id="customerForm">

            <button type="button"
                    id="removeModeBtn"
                    class="remove-customers-btn"
                    onclick="handleRemoveClick()">

                🗑️ Remove Customers

            </button>

        </form>

    </div>


    <!-- CUSTOMERS TABLE -->
<div class="customers-table-wrapper"></div>
    <table class="table table-bordered table-striped customers-table">

        <thead>

        <tr>

            <th class="checkboxColumn">
                Select
            </th>

            <th>Serial No.</th>

            <th>Name</th>

            <th>Email</th>

            <th>Mobile</th>

            <th>Address</th>

            <th>DOB</th>

        </tr>

        </thead>


        <tbody>

        {% for customer in customers %}

        <tr>

            <!-- CHECKBOX -->

            <td class="checkboxColumn">

                <input type="checkbox"
                       name="customer_ids"
                       value="{{ customer.id }}"
                       class="customerCheckbox"
                       form="customerForm">

            </td>


            <!-- SERIAL NUMBER -->

            <td>
                {{ loop.index }}
            </td>


            <!-- CUSTOMER NAME -->

            <td>
                {{ customer.name }}
            </td>


            <!-- EMAIL -->

            <td>
                {{ customer.email }}
            </td>


            <!-- MOBILE -->

            <td>
                {{ customer.phone }}
            </td>


            <!-- ADDRESS -->

            <td>
                {{ customer.address }}
            </td>


            <!-- DOB -->

            <td>
                {{ customer.dob }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>


<!-- JAVASCRIPT -->

<script>

function handleRemoveClick() {

    const checkboxes =
        document.querySelectorAll(".customerCheckbox");

    const selected =
        document.querySelectorAll(
            ".customerCheckbox:checked"
        );


    /* FIRST CLICK
       SHOW CHECKBOXES */

    if (selected.length === 0) {

        checkboxes.forEach(function (checkbox) {

            checkbox.closest(".checkboxColumn").style.display = "table-cell";

        });

        document.querySelectorAll(".checkboxColumn").forEach(function (column) {

            column.style.display = "table-cell";

        });

        return;
    }


    /* SECOND CLICK
       CONFIRM REMOVE */

    const confirmed = confirm(
        "Are you sure you want to remove " +
        selected.length +
        " customer(s)?"
    );


    if (confirmed) {

        document
            .getElementById("customerForm")
            .submit();

    }

}

</script>


</body>
</html>
