<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Offer | BESTTIVE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #f6f3fa;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin: 0 0 5px;
            color: #4B0082;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #777;
            font-size: 14px;
        }

        .card {
            background: #fff;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
        }

        .checks {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .checks label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }

        .checks input {
            width: auto;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        button,
        .back {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #4B0082;
            color: #fff;
        }

        .back {
            background: #eee;
            color: #333;
        }

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .actions {
                flex-direction: column;
            }

            button,
            .back {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Offer</h1>

    <div class="subtitle">
        Update {{ offer.name }}
    </div>

    <form
        method="POST"
        class="card"
    >

        <div class="grid">

            <div class="field">

                <label>Offer Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ offer.name }}"
                    required
                >

            </div>


            <div class="field">

                <label>Offer Type</label>

                <select name="offer_type">

                    {% for type in [
                        "Deal of the Day",
                        "Discount",
                        "Flash Sale",
                        "Festival Sale",
                        "Custom"
                    ] %}

                        <option
                            value="{{ type }}"
                            {% if offer.offer_type == type %}
                                selected
                            {% endif %}
                        >
                            {{ type }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="field full">

                <label>Homepage Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ offer.title or '' }}"
                >

            </div>


            <div class="field full">

                <label>Subtitle</label>

                <input
                    type="text"
                    name="subtitle"
                    value="{{ offer.subtitle or '' }}"
                >

            </div>


            <div class="field">

                <label>Discount (%)</label>

                <input
                    type="number"
                    name="discount_percent"
                    min="0"
                    max="100"
                    step="0.01"
                    value="{{ offer.discount_percent }}"
                >

            </div>


            <div class="field">

                <label>Position</label>

                <input
                    type="number"
                    name="position"
                    min="1"
                    value="{{ offer.position }}"
                >

            </div>


            <div class="field">

                <label>Start Date & Time</label>

                <input
                    type="datetime-local"
                    name="start_at"
                    value="{{ offer.start_at.strftime('%Y-%m-%dT%H:%M') if offer.start_at else '' }}"
                >

            </div>


            <div class="field">

                <label>End Date & Time</label>

                <input
                    type="datetime-local"
                    name="end_at"
                    value="{{ offer.end_at.strftime('%Y-%m-%dT%H:%M') if offer.end_at else '' }}"
                >

            </div>


            <div class="field full">

                <div class="checks">

                    <label>

                        <input
                            type="checkbox"
                            name="active"
                            {% if offer.active %}
                                checked
                            {% endif %}
                        >

                        Active

                    </label>


                    <label>

                        <input
                            type="checkbox"
                            name="show_homepage"
                            {% if offer.show_homepage %}
                                checked
                            {% endif %}
                        >

                        Show on Homepage

                    </label>

                </div>

            </div>

        </div>


        <div class="actions">

            <button type="submit">
                Save Changes
            </button>

            <a
                href="/admin/offers-deals"
                class="back"
            >
                Back
            </a>

        </div>

    </form>

</div>

</body>

</html>
