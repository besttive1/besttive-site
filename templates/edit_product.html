<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | BESTTIVE</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px 15px;

            font-family: Arial, sans-serif;

            background: #f7f4fb;

            color: #222;
        }


        .container {

            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            background: white;

            padding: 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(75, 0, 130, 0.13);
        }


        h2 {

            margin: 0 0 28px;

            color: #4b0082;

            font-size: 30px;

            text-align: center;
        }


        label {

            display: block;

            margin-top: 17px;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #333;
        }


        input[type="text"],
        input[type="number"],
        textarea,
        select {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d8cde5;

            border-radius: 8px;

            background: white;

            font-size: 15px;

            color: #222;

            outline: none;

            transition: 0.2s;
        }


        textarea {

            min-height: 130px;

            resize: vertical;
        }


        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {

            border-color: #4b0082;

            box-shadow:
                0 0 0 3px rgba(75, 0, 130, 0.10);
        }


        /* =========================
           TAX BOX
           ========================= */

        .tax-box {

            margin-top: 20px;

            padding: 18px;

            background: #faf7fd;

            border: 1px solid #e1d5eb;

            border-radius: 12px;
        }


        .tax-title {

            margin-bottom: 15px;

            color: #4b0082;

            font-size: 15px;

            font-weight: 700;
        }


        .tax-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        .tax-field label {

            margin-top: 0;

            margin-bottom: 7px;

            font-size: 13px;
        }


        .tax-field input {

            background: #f1edf5;

            color: #4b0082;

            font-weight: 700;

        }


        .tax-note {

            margin-top: 10px;

            color: #777;

            font-size: 12px;
        }


        /* =========================
           CURRENT IMAGE
           ========================= */

        .current-image-box {

            margin-top: 10px;

            padding: 15px;

            background: #faf8fd;

            border: 1px solid #e5dcef;

            border-radius: 10px;

            text-align: center;
        }


        .current-image-box img {

            width: 140px;

            height: 140px;

            object-fit: cover;

            border-radius: 10px;

            display: block;

            margin: 0 auto;
        }


        /* FILE INPUT */

        input[type="file"] {

            width: 100%;

            padding: 10px;

            border: 1px solid #d8cde5;

            border-radius: 8px;

            background: #faf8fd;

            cursor: pointer;

            font-size: 14px;
        }


        input[type="file"]:hover {

            border-color: #4b0082;
        }


        /* UPDATE BUTTON */

        button {

            width: 100%;

            margin-top: 28px;

            padding: 14px;

            background: #4b0082;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition: 0.2s;
        }


        button:hover {

            background: #310058;

            transform: translateY(-1px);
        }


        /* BACK BUTTON */

        .back-btn {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 11px;

            background: #eee7f5;

            color: #4b0082;

            border-radius: 8px;

            text-align: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .back-btn:hover {

            background: #e2d7ed;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding: 15px 10px;
            }


            .container {

                padding: 24px 18px;

                border-radius: 14px;
            }


            h2 {

                font-size: 24px;

                margin-bottom: 22px;
            }


            label {

                font-size: 13px;

                margin-top: 15px;
            }


            input[type="text"],
            input[type="number"],
            textarea,
            select {

                padding: 11px 12px;

                font-size: 14px;
            }


            textarea {

                min-height: 115px;
            }


            .current-image-box img {

                width: 120px;

                height: 120px;
            }


            input[type="file"] {

                font-size: 13px;

                padding: 9px;
            }


            button {

                padding: 13px;

                font-size: 15px;
            }


            .tax-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h2>✏️ Edit Product</h2>


    <form method="POST"
          enctype="multipart/form-data">


        <!-- PRODUCT NAME -->

        <label>
            Product Name
        </label>

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >


        <!-- PRICE -->

        <label>
            Price
        </label>

        <input
            type="number"
            name="price"
            value="{{ product.price }}"
            min="0"
            required
        >


        <!-- DESCRIPTION -->

        <label>
            Description
        </label>

        <textarea
            name="description"
        >{{ product.description }}</textarea>


        <!-- CATEGORY -->

        <label>
            Category
        </label>

        <select
            name="category"
            id="category"
            required
            onchange="updateSubcategories()"
        >

            <option value="">
                Select Category
            </option>

            {% for master_category in master_categories %}

                <option
                    value="{{ master_category.name }}"
                    {% if product.category == master_category.name %}selected{% endif %}
                >
                    {{ master_category.name }}
                </option>

            {% endfor %}

        </select>

        <!-- SUBCATEGORY -->

        <label>
            Subcategory
        </label>

        <select
            name="subcategory"
            id="subcategory"
            required
            onchange="updateTaxDetails()"
        >

            <option value="">
                Select Subcategory
            </option>

        </select>


        <!-- HSN + GST -->

        <div class="tax-box">

            <div class="tax-title">
                🧾 Automatic Tax Details
            </div>


            <div class="tax-grid">


                <div class="tax-field">

                    <label>
                        HSN Code
                    </label>

                    <input
                        type="text"
                        name="hsn_code"
                        id="hsn_code"
                        value="{{ product.hsn_code or '' }}"
                        readonly
                    >

                </div>


                <div class="tax-field">

                    <label>
                        GST Rate
                    </label>

                    <input
                        type="text"
                        id="gst_display"
                        value="{% if product.gst_rate is not none %}{{ product.gst_rate }}%{% endif %}"
                        readonly
                    >

                    <input
                        type="hidden"
                        name="gst_rate"
                        id="gst_rate"
                        value="{{ product.gst_rate or 0 }}"
                    >

                </div>


            </div>


            <div class="tax-note">
                HSN code and GST rate are automatically assigned
                according to the selected product classification.
            </div>

        </div>


        <!-- STOCK -->

        <label>
            Stock
        </label>

        <input
            type="number"
            name="stock"
            value="{{ product.stock }}"
            min="0"
        >


        <!-- CURRENT IMAGE -->

        <label>
            Current Image
        </label>


        <div class="current-image-box">

            <img
                src="{{ product.image }}"
                alt="{{ product.name }}"
            >

        </div>


        <!-- CHANGE IMAGE -->

        <label>
            Change Image
        </label>

        <input
            type="file"
            name="image"
            accept="image/*"
        >


        <!-- UPDATE -->

        <button type="submit">
            💾 Update Product
        </button>


        <a
            href="/admin/products"
            class="back-btn"
        >
            ⬅ Back to Products
        </a>


    </form>

</div>


<script>

/* ==========================================
   SUBCATEGORY OPTIONS
   ========================================== */

const subcategoryOptions = {

    "Clothes": [
        "Jeans",
        "Shirts",
        "T-Shirts",
        "Dresses",
        "Sarees"
    ],

    "Toys": [
        "Cars",
        "Dolls",
        "Educational Toys",
        "Remote Control"
    ],

    "Jewellery": [
        "Bangles",
        "Earrings",
        "Necklace",
        "Rings"
    ],

    "Beauty": [
        "Makeup",
        "Skincare",
        "Hair Care"
    ],

    "Shoes": [
        "Men Shoes",
        "Women Shoes",
        "Kids Shoes",
        "Sports Shoes"
    ],
    
/* ==========================================
   TAX MAPPING
   ========================================== */

const taxMapping = {

    "Clothes": {

        "Jeans": {
            hsn: "6203",
            gst: "5%"
        },

        "Shirts": {
            hsn: "6205",
            gst: "5%"
        },

        "T-Shirts": {
            hsn: "6109",
            gst: "5%"
        },

        "Dresses": {
            hsn: "6204",
            gst: "5%"
        },

        "Sarees": {
            hsn: "5208",
            gst: "5%"
        }

    },

    "Toys": {

        "Cars": {
            hsn: "9503",
            gst: "12%"
        },

        "Dolls": {
            hsn: "9503",
            gst: "12%"
        },

        "Educational Toys": {
            hsn: "9503",
            gst: "12%"
        },

        "Remote Control": {
            hsn: "9503",
            gst: "12%"
        }

    },

    "Jewellery": {

        "Bangles": {
            hsn: "7117",
            gst: "3%"
        },

        "Earrings": {
            hsn: "7117",
            gst: "3%"
        },

        "Necklace": {
            hsn: "7117",
            gst: "3%"
        },

        "Rings": {
            hsn: "7117",
            gst: "3%"
        }

    },

    "Beauty": {

        "Makeup": {
            hsn: "3304",
            gst: "18%"
        },

        "Skincare": {
            hsn: "3304",
            gst: "18%"
        },

        "Hair Care": {
            hsn: "3305",
            gst: "18%"
        }

    },

    "Shoes": {

        "Men Shoes": {
            hsn: "6403",
            gst: "5%"
        },

        "Women Shoes": {
            hsn: "6403",
            gst: "5%"
        },

        "Kids Shoes": {
            hsn: "6403",
            gst: "5%"
        },

        "Sports Shoes": {
            hsn: "6404",
            gst: "5%"
        }

    },
  
    "Electronics": {

        "Mobile": {
            hsn: "8517",
            gst: "18%"
        },

        "Earbuds": {
            hsn: "8518",
            gst: "18%"
        },

        "Speakers": {
            hsn: "8518",
            gst: "18%"
        },

        "Accessories": {
            hsn: "8517",
            gst: "18%"
        }

    },

    "Home": {

        "Decor": {
            hsn: "3926",
            gst: "18%"
        },

        "Kitchen": {
            hsn: "3924",
            gst: "18%"
        },

        "Storage": {
            hsn: "3924",
            gst: "18%"
        }

    }

};


/* ==========================================
   LOAD SUBCATEGORY
   ========================================== */

function updateSubcategories() {

    const category =
        document.getElementById("category").value;

    const subcategory =
        document.getElementById("subcategory");


    const currentSubcategory =
        "{{ product.subcategory }}";


    subcategory.innerHTML =
        '<option value="">Select Subcategory</option>';


    if (subcategoryOptions[category]) {

        subcategoryOptions[category].forEach(function(item) {

            const option =
                document.createElement("option");

            option.value = item;

            option.textContent = item;


            if (item === currentSubcategory) {
                option.selected = true;
            }


            subcategory.appendChild(option);

        });

    }


    updateTaxDetails();

}


/* ==========================================
   UPDATE HSN + GST
   ========================================== */

function updateTaxDetails() {

    const category =
        document.getElementById("category").value;

    const subcategory =
        document.getElementById("subcategory").value;


    const tax =
        taxMapping[category]?.[subcategory];


    const hsnInput =
        document.getElementById("hsn_code");

    const gstInput =
        document.getElementById("gst_rate");

    const gstDisplay =
        document.getElementById("gst_display");


    if (tax) {

        hsnInput.value =
            tax.hsn;

        gstInput.value =
            tax.gst.replace("%", "");

        gstDisplay.value =
            tax.gst;

    }

}


/* ==========================================
   INITIAL LOAD
   ========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateSubcategories();

    }
);

</script>


</body>

</html>
