<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | BESTTIVE</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px 15px;

            font-family: Arial, sans-serif;

            background: #f7f4fb;

            color: #222;
        }


        /* MAIN CONTAINER */

        .container {

            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            background: white;

            padding: 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(75, 0, 130, 0.13);
        }


        /* HEADING */

        h2 {

            margin: 0 0 28px;

            color: #4b0082;

            font-size: 30px;

            text-align: center;
        }


        /* LABEL */

        label {

            display: block;

            margin-top: 17px;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #333;
        }


        /* INPUTS */

        input[type="text"],
        input[type="number"],
        textarea {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d8cde5;

            border-radius: 8px;

            background: white;

            font-size: 15px;

            color: #222;

            outline: none;

            transition: 0.2s;
        }


        /* TEXTAREA */

        textarea {

            min-height: 130px;

            resize: vertical;
        }


        /* FOCUS */

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {

            border-color: #4b0082;

            box-shadow:
                0 0 0 3px rgba(75, 0, 130, 0.10);
        }


        /* CURRENT IMAGE */

        .current-image-box {

            margin-top: 10px;

            padding: 15px;

            background: #faf8fd;

            border: 1px solid #e5dcef;

            border-radius: 10px;

            text-align: center;
        }


        .current-image-box img {

            width: 140px;

            height: 140px;

            object-fit: cover;

            border-radius: 10px;

            display: block;

            margin: 0 auto;
        }


        /* FILE INPUT */

        input[type="file"] {

            width: 100%;

            padding: 10px;

            border: 1px solid #d8cde5;

            border-radius: 8px;

            background: #faf8fd;

            cursor: pointer;

            font-size: 14px;
        }


        input[type="file"]:hover {

            border-color: #4b0082;
        }


        /* UPDATE BUTTON */

        button {

            width: 100%;

            margin-top: 28px;

            padding: 14px;

            background: #4b0082;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition: 0.2s;
        }


        button:hover {

            background: #310058;

            transform: translateY(-1px);
        }


        /* BACK BUTTON */

        .back-btn {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 11px;

            background: #eee7f5;

            color: #4b0082;

            border-radius: 8px;

            text-align: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .back-btn:hover {

            background: #e2d7ed;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            body {

                padding: 15px 10px;
            }


            .container {

                padding: 24px 18px;

                border-radius: 14px;
            }


            h2 {

                font-size: 24px;

                margin-bottom: 22px;
            }


            label {

                font-size: 13px;

                margin-top: 15px;
            }


            input[type="text"],
            input[type="number"],
            textarea {

                padding: 11px 12px;

                font-size: 14px;
            }


            textarea {

                min-height: 115px;
            }


            .current-image-box img {

                width: 120px;

                height: 120px;
            }


            input[type="file"] {

                font-size: 13px;

                padding: 9px;
            }


            button {

                padding: 13px;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h2>✏️ Edit Product</h2>


    <form method="POST"
          enctype="multipart/form-data">


        <label>
            Product Name
        </label>

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >


        <label>
            Price
        </label>

        <input
            type="number"
            name="price"
            value="{{ product.price }}"
            required
        >


        <label>
            Description
        </label>

        <textarea
            name="description"
        >{{ product.description }}</textarea>


        <label>
            Stock
        </label>

        <input
            type="number"
            name="stock"
            value="{{ product.stock }}"
        >


        <label>
            Current Image
        </label>


        <div class="current-image-box">

            <img
                src="{{ product.image }}"
                alt="{{ product.name }}"
            >

        </div>


        <label>
            Change Image
        </label>

        <input
            type="file"
            name="image"
            accept="image/*"
        >


        <button type="submit">
            💾 Update Product
        </button>


        <a
            href="/admin/products"
            class="back-btn"
        >
            ⬅ Back to Products
        </a>


    </form>

</div>


</body>

</html>
