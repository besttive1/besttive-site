<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BESTTIVE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f6f1fb;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            max-width: 92%;
            background: white;

            padding: 40px 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(75, 0, 130, 0.15);

            text-align: center;
        }

        .login-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #4b0082;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            margin: 0 0 8px;

            color: #4b0082;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #4b0082;
            box-shadow: 0 0 0 3px rgba(75, 0, 130, 0.10);
        }

        .login-btn {
            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #4b0082;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #310058;
        }

        .security-text {
            margin-top: 22px;

            font-size: 13px;
            color: #777;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-icon">
        👤
    </div>

    <h1>Login to BESTTIVE</h1>

    <div class="subtitle">
        Enter your email to receive OTP
    </div>

    <form method="POST">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn">
            ✈️ Request OTP
        </button>

    </form>

    <div class="security-text">
        🔒 Your login is secure and protected
    </div>

</div>

</body>
</html>
