<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }} | BESTTIVE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
    .product-detail-btn {
        width: 220px;
        height: 48px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .add-cart-btn {
        background: white;
        color: #4b0082;
        border: 2px solid #4b0082;
    }

    .add-cart-btn:hover {
        background: #4b0082;
        color: white;
    }

    .buy-now-btn {
        background: #4b0082;
        color: white;
        border: 2px solid #4b0082;
    }

    .buy-now-btn:hover {
        background: #310058;
        border-color: #310058;
    }
</style>
</head>

<body style="background:#f5f5f5;">

<div style="max-width:1200px;
            margin:40px auto;
            background:white;
            border-radius:15px;
            padding:30px;
            display:flex;
            gap:50px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);">
    
    <!-- LEFT IMAGE -->

<div style="display:flex;gap:20px;flex:1;">

    <!-- Thumbnails -->

    <div style="display:flex;flex-direction:column;gap:12px;">

        <!-- Main Image -->

        <img
            src="{{ product.image }}"
            onclick="changeImage(this.src)"
            style="width:80px;height:80px;object-fit:cover;border:1px solid #ddd;cursor:pointer;border-radius:8px;"
        >

        <!-- Extra Images -->

        {% for img in images %}

        <img
            src="{{ img.image }}"
            onclick="changeImage(this.src)"
            style="width:80px;height:80px;object-fit:cover;border:1px solid #ddd;cursor:pointer;border-radius:8px;"
        >

        {% endfor %}

    </div>

    <!-- Large Image -->

<div style="display:flex;gap:20px;align-items:flex-start;">

    <!-- Main Image -->

    <div
        style="overflow:hidden;
               border-radius:15px;
               width:100%;
               max-width:450px;">

        <img
            id="mainImage"
            src="{{ product.image }}"
            style="
                width:100%;
                display:block;
                cursor:zoom-in;
                border-radius:15px;
            "
            onmousemove="zoom(event)"
            onmouseleave="resetZoom()"
        >

    </div>
    </div>
</div>

    <!-- RIGHT DETAILS -->
    <div style="flex:1;">

        <h1>{{ product.name }}</h1>

        <h2 style="color:#e91e63;">
            ₹{{ product.price }}
        </h2>

        <p style="line-height:30px;font-size:18px;">

            {{ product.description }}

        </p>

        <p>

            <b>Stock :</b>

            {% if product.stock > 0 %}
                <span style="color:green;">
                    In Stock ({{ product.stock }})
                </span>

            {% else %}

                <span style="color:red;">
                    Out of Stock
                </span>

            {% endif %}

        </p>

        <br>

        <a href="/add-to-cart/{{ product.id }}">
            <button class="product-detail-btn add-cart-btn">
                🛒 Add To Cart
            </button>
        </a>

        <br><br>

        <a href="/payment/{{ product.name }}/{{ product.price }}">
            <button class="product-detail-btn buy-now-btn">
                🛍️ Buy Now
            </button>
        </a>

        <br><br>

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>
<script>

function changeImage(src){

    document.getElementById("mainImage").src = src;

}

function zoom(e){

    let img = document.getElementById("mainImage");

    let rect = img.getBoundingClientRect();

    let x = ((e.clientX - rect.left)/rect.width)*100;

    let y = ((e.clientY - rect.top)/rect.height)*100;

    img.style.transformOrigin = x + "% " + y + "%";

    img.style.transform = "scale(2)";

}

function resetZoom(){

    let img = document.getElementById("mainImage");

    img.style.transform = "scale(1)";

}

</script>
</body>
</html>
