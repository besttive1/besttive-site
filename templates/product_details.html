<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }} | BESTTIVE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="background:#f5f5f5;">

<div style="max-width:1200px;
            margin:40px auto;
            background:white;
            border-radius:15px;
            padding:30px;
            display:flex;
            gap:50px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);">

    <!-- LEFT IMAGE -->
    <div style="flex:1;text-align:center;">

        <img src="{{ product.image }}"
             style="width:100%;
                    max-width:420px;
                    border-radius:15px;">

    </div>

    <!-- RIGHT DETAILS -->
    <div style="flex:1;">

        <h1>{{ product.name }}</h1>

        <h2 style="color:#e91e63;">
            ₹{{ product.price }}
        </h2>

        <p style="line-height:30px;font-size:18px;">

            {{ product.description }}

        </p>

        <p>

            <b>Stock :</b>

            {% if product.stock > 0 %}
                <span style="color:green;">
                    In Stock ({{ product.stock }})
                </span>

            {% else %}

                <span style="color:red;">
                    Out of Stock
                </span>

            {% endif %}

        </p>

        <br>

        <a href="/add-to-cart/{{ product.id }}">
            <button style="width:220px;">
                🛒 Add To Cart
            </button>
        </a>

        <br><br>

        <a href="/payment/{{ product.name }}/{{ product.price }}">
            <button style="width:220px;background:#fb641b;">
                ⚡ Buy Now
            </button>
        </a>

        <br><br>

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
