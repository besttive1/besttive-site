<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - BESTTIVE</title>
</head>
<body>

<h2>Verify OTP</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <p style="color:red;">{{ message }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">
    <input
        type="text"
        name="otp"
        placeholder="Enter OTP"
        required
    >

    <button type="submit">Verify OTP</button>
</form>

</body>
</html>
