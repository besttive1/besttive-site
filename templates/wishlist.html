<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist | BESTTIVE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div style="
    max-width:1100px;
    margin:40px auto;
    padding:20px;
">

    <h2>❤️ My Wishlist</h2>

    {% if items %}

        <div style="
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:20px;
        ">

        {% for item in items %}

            <div style="
                background:white;
                padding:15px;
                border-radius:12px;
                box-shadow:0 3px 12px rgba(0,0,0,.1);
                text-align:center;
            ">

                <img
                    src="{{ item.product.image }}"
                    style="
                        width:100%;
                        height:200px;
                        object-fit:contain;
                        border-radius:10px;
                    "
                >

                <h3>{{ item.product.name }}</h3>

                <h4>₹{{ item.product.price }}</h4>

                <a href="/product/{{ item.product.id }}">
                    <button>
                        View Product
                    </button>
                    <br><br>

<a href="/wishlist/remove/{{ item.id }}"
   onclick="return confirm('Remove this product from your wishlist?');">

    <button type="button"
            style="background:#dc3545;color:white;">
        ❌ Remove
    </button>

</a>
                </a>

            </div>

        {% endfor %}

        </div>

    {% else %}

        <h3>Your Wishlist is Empty ❤️</h3>

        <a href="/">
            Continue Shopping
        </a>

    {% endif %}

    <br><br>

    <a href="/">
        ← Back to Home
    </a>

</div>

</body>
</html>
